<!DOCTYPE html>
<html>
<head><title>Logo Preview</title>  <link rel="icon" href="/favicon.ico" sizes="any"/>
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png"/>
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png"/>
  <link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
  <meta property="og:image" content="https://www.dglaw.co.il/images/dardik-gross-logo.png"/>
</head>
<body style="margin:0; display:flex; gap:40px; align-items:center; justify-content:center; min-height:100vh; background:#f0f0f0;">
  <div style="background:#1a1a1a; padding:30px; border-radius:8px;">
    <p style="color:#aaa; text-align:center; font-family:sans-serif; margin-bottom:10px;">White logo (on dark bg)</p>
    <img src="logo-white.svg" alt="Logo White" style="height:120px;">
  </div>
  <div style="background:#fff; padding:30px; border-radius:8px; border:1px solid #ddd;">
    <p style="color:#666; text-align:center; font-family:sans-serif; margin-bottom:10px;">Dark logo (on light bg)</p>
    <img src="logo-dark.svg" alt="Logo Dark" style="height:120px;">
  </div>
</body>
</html>
